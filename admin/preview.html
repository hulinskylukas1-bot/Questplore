 const feed=document.getElementById('feed');feed.innerHTML='';document.getElementById('continueBar').classList.add('hidden');const st=stages[stageIndex];document.querySelector('.progress').textContent=(stageIndex+1)+' / '+stages.length;const label=document.createElement('div');label.className='preview-stage-name';label.textContent='Náhled části: '+st.internal_name;feed.appendChild(label);
 const blocks=st.blocks||[];let i=0;
 const next=()=>{if(i>=blocks.length){const bar=document.getElementById('continueBar'),btn=document.getElementById('continueBtn');bar.classList.remove('hidden');if(onlyStageId){btn.textContent='Konec části';btn.disabled=true;return}const ni=nextStage(stageIndex);btn.textContent=ni>=0?'Pokračovat':'Konec hry';btn.onclick=()=>{if(ni>=0){stageIndex=ni;renderStage()}else alert('Konec hry — náhled.')} ;return}const b=blocks[i++];if(b.block_type==='conditional_message'){const required=b.config?.when?.choice;if(required){const prior=blocks.slice(0,i-1).reverse().find(x=>x.block_type==='choice'&&Object.prototype.hasOwnProperty.call(choices,x.id));const selected=prior?choices[prior.id]:null;if(norm(required)!==norm(selected)){setTimeout(next,0);return}}}const w=document.createElement('div');w.className='reveal shown';w.innerHTML=blockHTML(b);feed.appendChild(w);const interactive=['text_answer','multi_term_answer','choice','quiz','sorting','logic_grid','gps','gps_confirmation','photo','confirm'].includes(b.block_type);bind(w,b,()=>setTimeout(next,180));if(!interactive)setTimeout(next,80)};
 next();
}

async function load(){
 if(!versionId){root.innerHTML='<div class="preview-empty">Chybí ID verze.</div>';return}
 const {data:{session}}=await supabase.auth.getSession();if(!session){root.innerHTML='<div class="preview-empty">Pro náhled se nejdřív přihlaste do Questplore Adminu.</div>';return}
 const {data:v,error:ve}=await supabase.from('game_versions').select('*').eq('id',versionId).single();if(ve){root.innerHTML='<div class="preview-empty">Verzi se nepodařilo načíst.</div>';return}version=v;
 const [{data:g},{data:gt},{data:ss},{data:tt}]=await Promise.all([
  supabase.from('games').select('*').eq('id',v.game_id).single(),
  supabase.from('game_translations').select('*').eq('game_version_id',versionId).eq('locale','cs').maybeSingle(),
  supabase.from('stages').select('*').eq('game_version_id',versionId).order('position'),
  supabase.from('transitions').select('*').eq('game_version_id',versionId)
 ]);
 game=g;translation=gt;stages=ss||[];transitions=tt||[];
 if(!stages.length){root.innerHTML='<div class="preview-empty">Tato verze zatím nemá žádné části.</div>';return}
 const ids=stages.map(s=>s.id);const {data:bb}=await supabase.from('blocks').select('id,stage_id,block_type,position,config,block_translations(locale,content)').in('stage_id',ids).order('position');const blocks=bb||[];
 for(const s of stages)s.blocks=blocks.filter(b=>b.stage_id===s.id).map(b=>({...b,content:b.block_translations?.find(t=>t.locale==='cs')?.content||b.block_translations?.[0]?.content||{}}));
 shell();
 if(onlyStageId){
   const i=stages.findIndex(s=>s.id===onlyStageId);
   if(i<0){root.querySelector('#feed').innerHTML='<div class="preview-empty">Část nebyla nalezena.</div>';return}
   stageIndex=i;
   renderStage();
 }else if(onlyBlockId){
   const b=blocks.find(x=>x.id===onlyBlockId);const st=stages.find(s=>s.id===b?.stage_id);if(!b||!st){root.querySelector('#feed').innerHTML='<div class="preview-empty">Blok nebyl nalezen.</div>';return}
   stageIndex=stages.findIndex(s=>s.id===st.id);document.querySelector('.progress').textContent='Blok';const feed=document.getElementById('feed');feed.innerHTML='<div class="preview-stage-name">Náhled bloku · '+esc(st.internal_name)+'</div>';const w=document.createElement('div');w.className='reveal shown';const full=st.blocks.find(x=>x.id===onlyBlockId);w.innerHTML=blockHTML(full);feed.appendChild(w);bind(w,full,()=>{const r=w.querySelector('.result');if(r&&!r.textContent)r.textContent='Blok dokončen — náhled.'});document.getElementById('restart').onclick=()=>location.reload();
 }else renderStage();
}
load();
</script>
