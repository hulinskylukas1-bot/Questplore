<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1013">
<title>Questplore — Náhled hry</title>
<link rel="stylesheet" id="playerCss">
<style>
body{min-height:100vh}
.preview-ribbon{position:fixed;z-index:100;top:10px;right:10px;background:#e0b45c;color:#111;padding:6px 10px;border-radius:999px;font:700 11px/1 system-ui;box-shadow:0 4px 20px #0008}
.preview-empty{padding:24px;color:#aaa}
.preview-stage-name{font-size:12px;color:#9ca3af;margin-bottom:8px}
</style>
</head>
<body>
<div class="preview-ribbon">NÁHLED ADMINU</div>
<div id="app"></div>
<!--
  Tento náhled NEMÁ vlastní kopii hry. Načítá skutečné soubory přehrávače
  (app-core.js, app-ui1.js, app-ui2.js, styles.css) a jen jim předá obsah hry z administrace.
  Každá změna ve hře se proto v náhledu projeví sama.
-->
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://hnhyscllpnyzbxhrffph.supabase.co';
const SUPABASE_KEY='sb_publishable_w0N986iN3rTUBQjDLogNhQ_BXcmNRWH';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const root=document.getElementById('app');
const qs=new URLSearchParams(location.search);
const versionId=qs.get('version'),onlyBlockId=qs.get('block'),onlyStageId=qs.get('stage'),useGps=qs.get('gps')!=='0';
const stamp=Date.now();
const msg=t=>{root.innerHTML='<div class="preview-empty">'+t+'</div>'};
const loadScript=src=>new Promise((ok,fail)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>fail(new Error('Nepodařilo se načíst '+src));document.head.appendChild(s)});

async function load(){
 if(!versionId){msg('Chybí ID verze.');return}
 const {data:{session}}=await supabase.auth.getSession();
 if(!session){msg('Pro náhled se nejdřív přihlaste do Questplore Adminu.');return}
 const {data:v,error:ve}=await supabase.from('game_versions').select('*').eq('id',versionId).single();
 if(ve){msg('Verzi se nepodařilo načíst.');return}
 const [{data:g},{data:gt},{data:ss},{data:tt}]=await Promise.all([
  supabase.from('games').select('*').eq('id',v.game_id).single(),
  supabase.from('game_translations').select('*').eq('game_version_id',versionId).eq('locale','cs').maybeSingle(),
  supabase.from('stages').select('*').eq('game_version_id',versionId).order('position'),
  supabase.from('transitions').select('*').eq('game_version_id',versionId)
 ]);
 const stages=ss||[];
 if(!stages.length){msg('Tato verze zatím nemá žádné části.');return}
 const ids=stages.map(s=>s.id);
 const {data:bb}=await supabase.from('blocks').select('id,stage_id,block_type,position,config,block_translations(locale,content)').in('stage_id',ids).order('position');
 const blocks=bb||[];
 for(const s of stages)s.blocks=blocks.filter(b=>b.stage_id===s.id).map(b=>({id:b.id,block_type:b.block_type,position:b.position,config:b.config||{},content:b.block_translations?.find(t=>t.locale==='cs')?.content||b.block_translations?.[0]?.content||{}}));
 // stejný tvar dat, jaký přehrávači dává databáze při startu hry
 const data={game:g,translation:{title:gt?.title,description:gt?.description},stages,transitions:tt||[]};
 let startIndex=0,mode='game';
 if(onlyStageId){
   startIndex=stages.findIndex(s=>s.id===onlyStageId);
   if(startIndex<0){msg('Část nebyla nalezena.');return}
   mode='stage';
 }else if(onlyBlockId){
   startIndex=stages.findIndex(s=>s.blocks.some(b=>b.id===onlyBlockId));
   if(startIndex<0){msg('Blok nebyl nalezen.');return}
   mode='block';
 }
 window.QUESTPLORE_PREVIEW={skipGps:!useGps};
 window.__PREVIEW={data,startIndex,mode,blockId:onlyBlockId};
 document.getElementById('playerCss').href='../styles.css?t='+stamp;
 try{
   await loadScript('../app-core.js?t='+stamp);
   await loadScript('../app-ui1.js?t='+stamp);
   await loadScript('../app-ui2.js?t='+stamp);
 }catch(e){msg(e.message);return}
 // klasický skript: sdílí proměnné přehrávače (data, stageIndex, state ...)
 const boot=document.createElement('script');
 boot.textContent=`(function(){
  const P=window.__PREVIEW;
  data=P.data;session=null;
  uploadPhotoEvidence=async file=>({evidence_id:null,storage_path:null,file_name:file.name});
  const origReveal=revealUntilStop;
  revealUntilStop=function(){
    origReveal();
    if(P.mode==='stage'){
      const bar=document.getElementById('continueBar'),btn=document.getElementById('continueBtn');
      if(bar&&!bar.classList.contains('hidden')&&btn){btn.textContent='Konec části';btn.disabled=true}
    }
  };
  if(P.mode==='block'){
    unlock=function(){const r=document.querySelector('#feed .result');if(r&&!r.textContent)r.textContent='Blok dokončen — náhled.'};
  }
  function start(){
    Object.assign(state,{lastChoice:null,choices:{},solved:{},responses:{},quizAnswers:{},progressStep:0,seenBlockIds:[],visitedStageIds:[],hintsUsed:{},startedAtMs:null,finishedSec:null});
    stageIndex=P.startIndex;cursor=0;visible=[];waiting=false;
    state.visitedStageIds=[data.stages[stageIndex].id];
    startTimer({});
    shell();
    const restart=document.getElementById('archiveBtn');if(restart){restart.textContent='Restart';restart.onclick=start}
    const close=document.getElementById('exitGame');if(close){close.textContent='Zavřít náhled';close.onclick=()=>window.close()}
    const feed=document.getElementById('feed'),st=data.stages[stageIndex];
    const label=document.createElement('div');label.className='preview-stage-name';
    label.textContent=(P.mode==='block'?'Náhled bloku · ':'Náhled části: ')+st.internal_name;
    feed.appendChild(label);
    if(P.mode==='block'){
      document.querySelector('.progress').textContent='Blok';
      const b=st.blocks.find(x=>x.id===P.blockId);
      appendBlock(b);
    }else{
      revealUntilStop();
    }
  }
  start();
 })();`;
 document.head.appendChild(boot);
}
load().catch(e=>msg('Náhled se nepodařilo spustit: '+(e?.message||e)));
</script>
</body>
</html>
